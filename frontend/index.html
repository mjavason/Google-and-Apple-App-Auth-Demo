<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
</head>

<body>
    <main>
        <h2>Sign in</h2>

        <button id="googleSignInBtn">Continue with Google</button>

        <p id="status"></p>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAH0YegOcfvhGrSkcTmBiAB8wfW7oEuSco",
            authDomain: "auth-demo-a4386.firebaseapp.com",
            projectId: "auth-demo-a4386",
            appId: "1:216685549681:web:4ba2c813f8c9439fc0a3d0"
        };

        const API_URL =
            "https://google-and-apple-app-auth-demo-backend.onrender.com";

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const button = document.getElementById("googleSignInBtn");
        const status = document.getElementById("status");

        // Get the state generated by Expo.
        const params = new URLSearchParams(window.location.search);
        const state = params.get("state");

        async function signInWithGoogle() {
            if (!state) {
                status.textContent = "Invalid authentication request.";
                return;
            }

            try {
                button.disabled = true;

                console.log("[AUTH] Starting authentication");

                status.textContent = "Signing in with Google...";

                await auth.setPersistence(
                    firebase.auth.Auth.Persistence.LOCAL
                );

                console.log("[AUTH] Firebase persistence configured");

                const result = await auth.signInWithPopup(provider);

                console.log("[AUTH] Google authentication successful");

                const user = result.user;

                const idToken = await user.getIdToken();

                console.log("[AUTH] Firebase ID token obtained");

                status.textContent = "Completing authentication...";

                console.log("[AUTH] Sending exchange request");

                const res = await fetch(
                    `${API_URL}/auth/mobile/exchange`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            idToken,
                            state
                        })
                    }
                );

                console.log("[AUTH] Exchange response:", res.status);

                const data = await res.json();

                console.log("[AUTH] Exchange result:", {
                    success: data.success,
                    hasCode: Boolean(data.code)
                });

                if (!res.ok || !data.success || !data.code) {
                    throw new Error(
                        data.message || "Authentication failed."
                    );
                }

                const callback = new URL("app://auth");

                callback.searchParams.set("code", data.code);
                callback.searchParams.set("state", state);

                console.log("[AUTH] Redirect URL:", callback.toString());

                status.textContent = "Redirecting to application...";

                window.location.href = callback.toString();

            } catch (error) {
                console.error("[AUTH] Authentication failed:", error);

                status.textContent =
                    error.message || "Authentication failed.";

                button.disabled = false;
            }
        }
        button.addEventListener("click", signInWithGoogle);
    </script>
</body>

</html>
