<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            text-align: center;
            padding: 24px;
        }

        #google-button {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <main>
        <h2>Sign in</h2>

        <div id="google-button"></div>

        <p id="status"></p>
    </main>

    <script type="module">
        import { initializeApp } from
            'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithCredential,
        } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';

        // Firebase configuration.
        const firebaseConfig = {
            apiKey: "AIzaSyAH0YegOcfvhGrSkcTmBiAB8wfW7oEuSco",
            authDomain: "auth-demo-a4386.firebaseapp.com",
            projectId: "auth-demo-a4386",
            appId: "1:216685549681:web:4ba2c813f8c9439fc0a3d0"
        };

        const API_URL =
            'https://google-and-apple-app-auth-demo-backend.onrender.com';

        // Your Google OAuth Web Client ID.
        const GOOGLE_CLIENT_ID =
            '216685549681-gko5p0sdkmv6b967cf7cj8vl44v5upb4.apps.googleusercontent.com';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const googleButton = document.getElementById('google-button');
        const status = document.getElementById('status');

        // Get the state generated by the Expo application.
        const params = new URLSearchParams(window.location.search);
        const state = params.get('state');

        let processing = false;

        function setStatus(message) {
            status.textContent = message;
        }

        function setLoading(loading) {
            processing = loading;
            googleButton.style.pointerEvents = loading ? 'none' : 'auto';
            googleButton.style.opacity = loading ? '0.5' : '1';
        }

        // Load Google Identity Services.
        function loadGoogleIdentityServices() {
            return new Promise((resolve, reject) => {
                if (window.google?.accounts?.id) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');

                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;

                script.onload = resolve;
                script.onerror = () => {
                    reject(new Error('Could not load Google Identity Services.'));
                };

                document.head.appendChild(script);
            });
        }

        // Exchange the Google ID token with Firebase, then your backend.
        async function handleGoogleCredential(googleIdToken) {
            if (processing) return;

            try {
                setLoading(true);
                setStatus('Authenticating with Firebase...');

                // Convert Google's ID token into a Firebase credential.
                const credential =
                    GoogleAuthProvider.credential(googleIdToken);

                // Sign in to Firebase WITHOUT a redirect.
                const result = await signInWithCredential(auth, credential);

                // Obtain the Firebase ID token.
                const firebaseIdToken = await result.user.getIdToken();

                setStatus('Completing authentication...');

                // Exchange Firebase ID token for a temporary authorization code.
                const response = await fetch(
                    `${API_URL}/auth/mobile/exchange`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            idToken: firebaseIdToken,
                            state,
                        }),
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success || !data.code) {
                    throw new Error(
                        data.message || 'Authentication failed.'
                    );
                }

                // Return to the Expo application.
                const callback = new URL('app://auth');

                callback.searchParams.set('code', data.code);
                callback.searchParams.set('state', state);

                window.location.replace(callback.toString());

            } catch (error) {
                console.error('Authentication error:', error);

                setStatus(
                    error instanceof Error
                        ? error.message
                        : 'Authentication failed.'
                );

                setLoading(false);
            }
        }

        async function initialize() {
            if (!state) {
                setStatus('Invalid authentication request.');
                return;
            }

            try {
                setStatus('Loading Google sign-in...');

                await loadGoogleIdentityServices();

                window.google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,

                    callback: (response) => {
                        if (!response.credential) {
                            setStatus('Google did not return an ID token.');
                            return;
                        }

                        handleGoogleCredential(response.credential);
                    },

                    auto_select: false,
                });

                // Render Google's official sign-in button.
                window.google.accounts.id.renderButton(
                    googleButton,
                    {
                        theme: 'outline',
                        size: 'large',
                        text: 'continue_with',
                        shape: 'rectangular',
                        width: 280,
                    }
                );

                setStatus('');

            } catch (error) {
                console.error('Initialization error:', error);

                setStatus(
                    error instanceof Error
                        ? error.message
                        : 'Could not initialize Google sign-in.'
                );
            }
        }

        initialize();
    </script>
</body>

</html>
