
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase Authentication Test</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
</head>

<body>
    <main>
        <h2>Google Sign In</h2>

        <button id="loginBtn">Continue with Google</button>

        <p id="status">Not authenticated</p>

        <button id="returnBtn" hidden>
            Return to App
        </button>
    </main>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyAH0YegOcfvhGrSkcTmBiAB8wfW7oEuSco",
            authDomain: "auth-demo-a4386.firebaseapp.com",
            projectId: "auth-demo-a4386",
            appId: "1:216685549681:web:4ba2c813f8c9439fc0a3d0"
        });

        const auth = firebase.auth();

        const params = new URLSearchParams(window.location.search);
        const redirectUri = params.get('redirect_uri');

        const loginBtn = document.getElementById('loginBtn');
        const returnBtn = document.getElementById('returnBtn');
        const status = document.getElementById('status');

        loginBtn.addEventListener('click', async () => {
            try {
                loginBtn.disabled = true;
                status.textContent = 'Signing in...';

                const provider = new firebase.auth.GoogleAuthProvider();

                const result = await auth.signInWithPopup(provider);

                console.log('[AUTH] Login successful:', result.user);

                status.textContent =
                    `Authenticated: ${result.user.email}`;

                loginBtn.hidden = true;
                returnBtn.hidden = false;

            } catch (error) {
                console.error(error);

                status.textContent = error.message;
                loginBtn.disabled = false;
            }
        });

        returnBtn.addEventListener('click', () => {
            if (!redirectUri) {
                status.textContent = 'Missing redirect URI';
                return;
            }

            status.textContent = 'Returning to application...';

            window.location.href = redirectUri;
        });
    </script>
</body>
</html>
