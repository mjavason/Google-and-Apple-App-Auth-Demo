<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
</head>

<body>
    <main>
        <h2>Sign in</h2>
        <button id="googleSignInBtn">Continue with Google</button>
        <p id="status"></p>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAH0YegOcfvhGrSkcTmBiAB8wfW7oEuSco",
            authDomain: "auth-demo-a4386.firebaseapp.com",
            projectId: "auth-demo-a4386",
            appId: "1:216685549681:web:4ba2c813f8c9439fc0a3d0"
        };

        const API_URL =
            "https://google-and-apple-app-auth-demo-backend.onrender.com";

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const button = document.getElementById("googleSignInBtn");
        const status = document.getElementById("status");

        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("sessionId");
        const platform = params.get("platform");

        async function signInWithGoogle() {
            if (!sessionId || !["ios", "android"].includes(platform)) {
                status.textContent = "Invalid authentication session.";
                return;
            }

            try {
                button.disabled = true;
                status.textContent = "Signing in with Google...";

                const result = await auth.signInWithPopup(provider);
                const idToken = await result.user.getIdToken();

                status.textContent = "Completing authentication...";

                const response = await fetch(
                    `${API_URL}/auth/mobile/complete`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            sessionId,
                            idToken
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Authentication failed.");
                }

                status.textContent = "Authentication complete.";

                if (platform === "android") {
                    // This closes the Android authentication browser
                    // by returning control to the app.
                    window.location.href = "app://auth/complete";
                } else {
                    // Expo polls the backend and dismisses the browser.
                    status.textContent = "Authentication complete. You can return to the app.";
                }
            } catch (error) {
                console.error("Authentication error:", error);

                status.textContent =
                    error.message || "Authentication failed.";

                button.disabled = false;
            }
        }

        button.addEventListener("click", signInWithGoogle);
    </script>
</body>

</html>
